[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[project]
name = "robotpy-pykit"
version = "1.0.5"
description = "A logging, telemetry, and replay framework for FRC robots running python"
readme = "README.md"
authors = [{ name = "Luke Maxwell", email = "luke@whsrobotics.org" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["pykit", "frc", "robotics", "logging", "telemetry", "replay"]
dependencies = [
    "pyntcore >=2026.1.1",
    "robotpy-wpimath >=2026.1.1",
    "robotpy-wpiutil >=2026.1.1",
    "wpilib>=2026.1.1",
    "robotpy-hal >=2026.1.1",
    "pyfrc >= 2026.0.1",
]
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "docformatter>=1.7.8",
    "pre-commit>=4.6.2",
    "pyproject-fmt>=2.30.1",
    "ruff>=0.16.10",
]

[project.urls]
Homepage = "https://github.com/1757WestwoodRobotics/PyKit"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true
warn_no_return = true

[tool.uv.build-backend]
module-name = "pykit"

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = true
lint.select = [ "E", "F", "I001" ]
lint.ignore = []
lint.fixable = [ "ALL" ]
lint.unfixable = []
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.docformatter]
recursive = false
black = true
force-wrap = true
blank = true

[tool.pyproject-fmt]
column_width = 88
indent = 4
keep_full_version = false
max_supported_python = "3.14"

[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "standard"
exclude = [ "template_projects" ]
reportUndefinedVariable = "none"
reportUnusedFunction = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"

